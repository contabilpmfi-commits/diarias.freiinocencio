<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Visualizar Diária</title>

<style>
body {
  font-family: Arial;
  background:#eef2f7;
  padding:20px;
}

.card {
  background:white;
  padding:20px;
  border-radius:10px;
  margin-bottom:20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

h2 {
  color:#0d3b66;
}

button {
  padding:10px 15px;
  margin:5px;
  cursor:pointer;
  border:none;
  border-radius:6px;
}

.aprovar { background:green; color:white; }
.reprovar { background:red; color:white; }
.excluir { background:black; color:white; }
.voltar { background:#145da0; color:white; }

.link-doc {
  display:block;
  margin-top:10px;
  font-size:16px;
}
</style>

</head>

<body>

<h2>Detalhes da Solicitação</h2>

<div id="dados" class="card">
Carregando...
</div>

<div class="card">
<button class="aprovar" onclick="aprovar()">✔ Aprovar</button>
<button class="reprovar" onclick="reprovar()">✖ Reprovar</button>
<button class="excluir" onclick="excluir()">🗑 Excluir</button>
<button class="voltar" onclick="voltar()">⬅ Voltar</button>
</div>

<script>

var URL = "https://script.google.com/macros/s/AKfycbwaNkKZrNyBrbkB7D5U89g2h9SaDAfqXHAQAmBB3aGm2rKTiAOUuTkaW_W0tEoNrD0gaw/exec";

var params = new URLSearchParams(window.location.search);
var id = params.get("id");

// 🔥 CARREGAR
function carregar(){

fetch(URL)
.then(r=>r.json())
.then(dados=>{

// 🔥 CORREÇÃO DO ID (ESSENCIAL)
let item = dados.find(l => Number(l[0]) === Number(id));

if(!item){
  document.getElementById("dados").innerHTML = "Registro não encontrado";
  return;
}

let linkDoc = item[11];

document.getElementById("dados").innerHTML = `
<b>Nº:</b> ${item[0]}<br><br>
<b>Nome:</b> ${item[2]}<br>
<b>CPF:</b> ${item[3]}<br>
<b>Secretaria:</b> ${item[4]}<br>
<b>Destino:</b> ${item[5]}<br><br>

<b>Saída:</b> ${item[6]}<br>
<b>Retorno:</b> ${item[7]}<br><br>

<b>Objetivo:</b><br>${item[8]}<br><br>

<b>Status:</b> <b>${item[9]}</b><br>
<b>Motivo:</b> ${item[10] || "-"}<br>

${linkDoc ? `<a class="link-doc" href="${linkDoc}" target="_blank">📄 Abrir Documento</a>` : ""}
`;

})
.catch(err=>{
  console.error(err);
  document.getElementById("dados").innerHTML = "Erro ao carregar dados";
});

}

// 🔥 APROVAR
function aprovar(){

if(!confirm("Confirmar aprovação?")) return;

fetch(URL+"?acao=aprovar&id="+id)
.then(res => res.text())
.then(res => {

console.log("RESPOSTA:", res);

if(res === "OK"){
  alert("✅ Diária aprovada!");
  carregar();
}else{
  alert("❌ Erro ao aprovar");
}

})
.catch(err => {
  console.error(err);
  alert("Erro ao aprovar!");
});

}

// 🔥 REPROVAR
function reprovar(){

var motivo = prompt("Motivo da reprovação:");

if(!motivo) return;

fetch(URL+"?acao=reprovar&id="+id+"&motivo="+encodeURIComponent(motivo))
.then(res => res.text())
.then(res => {

if(res === "OK"){
  alert("Diária reprovada!");
  carregar();
}else{
  alert("Erro ao reprovar");
}

})
.catch(err => {
  console.error(err);
  alert("Erro ao reprovar!");
});

}

// 🔥 EXCLUIR
function excluir(){

if(!confirm("Deseja excluir esta solicitação?")) return;

fetch(URL+"?acao=excluir&id="+id)
.then(res => res.text())
.then(()=>{
  alert("Excluído com sucesso!");
  window.location.href = "admin.html";
});

}

// 🔙 VOLTAR
function voltar(){
  window.location.href = "admin.html";
}

carregar();

</script>

</body>
</html>
