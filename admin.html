<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Painel de Diárias</title>

<style>
body { font-family: Arial; background:#eef2f7; padding:20px;}
.topo { background:#0d3b66; color:white; padding:15px; margin-bottom:20px;}

input, select {
  padding:8px;
  margin:5px;
}

table { width:100%; border-collapse:collapse; background:white;}
th,td { padding:10px; border:1px solid #ccc;}
th { background:#0d3b66; color:white;}

button { padding:5px 10px; margin:2px; cursor:pointer;}
.visualizar { background:#145da0; color:white;}
.excluir { background:black; color:white;}
.link { text-decoration:none; font-size:18px; }

.loading {
  text-align:center;
  padding:20px;
}
</style>
</head>

<body>

<script>
var senha = prompt("Acesso restrito - Digite a senha:");
if(senha !== "frei123"){
  alert("Acesso negado");
  document.body.innerHTML="";
}
</script>

<div class="topo">
<h2>Painel de Diárias</h2>
</div>

<input id="busca" placeholder="Buscar nome...">
<select id="filtro">
<option value="">Todas Secretarias</option>
<option>Saúde</option>
<option>Educação</option>
<option>Administração</option>
<option>FAZENDA</option>
</select>

<table id="tabela">
<tr><td class="loading">Carregando...</td></tr>
</table>

<script>

var URL = "https://script.google.com/macros/s/AKfycbwaNkKZrNyBrbkB7D5U89g2h9SaDAfqXHAQAmBB3aGm2rKTiAOUuTkaW_W0tEoNrD0gaw/exec";

function carregar(){

fetch(URL)
.then(r=>r.json())
.then(dados=>{

let busca = document.getElementById("busca").value.toLowerCase();
let filtro = document.getElementById("filtro").value;

let html="<tr><th>Nº</th><th>Nome</th><th>Secretaria</th><th>Destino</th><th>Status</th><th>Ações</th></tr>";

dados.slice(1).forEach(l=>{

let nome = l[2] || "";
let secretaria = l[5] || "";
let destino = l[7] || "";
let status = l[16] || "PENDENTE";
let link = l[18] || "";

if(busca && !nome.toLowerCase().includes(busca)) return;
if(filtro && secretaria != filtro) return;

html+=`<tr>
<td>${l[0]}</td>
<td>${nome}</td>
<td>${secretaria}</td>
<td>${destino}</td>
<td><b>${status}</b></td>
<td>

<button class="visualizar" onclick="visualizar(${l[0]})">👁</button>

${link ? `<a class="link" href="${link}" target="_blank">📄</a>` : ""}

<button class="excluir" onclick="excluir(${l[0]})">🗑</button>

</td>
</tr>`;
});

document.getElementById("tabela").innerHTML=html;

})
.catch(err=>{
  console.error(err);
  document.getElementById("tabela").innerHTML = "<tr><td>Erro ao carregar dados</td></tr>";
});

}

function visualizar(id){
  window.location.href = "visualizar.html?id=" + id;
}

function excluir(id){

if(!confirm("Deseja excluir esta solicitação?")) return;

fetch(URL+"?acao=excluir&id="+id)
.then(res => res.text())
.then(res => {
  console.log("Excluir:", res);
  carregar();
})
.catch(err=>{
  console.error(err);
  alert("Erro ao excluir");
});

}

document.getElementById("busca").onkeyup = carregar;
document.getElementById("filtro").onchange = carregar;

carregar();

</script>

</body>
</html>
