<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Painel</title>
</head>

<body>

<h2>Painel de Diárias</h2>

<table border="1" id="tabela"></table>

<script>
var URL = "https://script.google.com/macros/s/AKfycbwVRTUjfHdFMoF3xF-52wsZGHNPfFI1nhGWafDo9J_iFVGSDz3McqZFVafjl1FRAol4Jw/exec";

fetch(URL)
.then(r=>r.json())
.then(dados=>{
let html="";
dados.forEach(l=>{
html+=`<tr>
<td>${l[0]}</td>
<td>${l[2]}</td>
<td>${l[4]}</td>
<td>${l[5]}</td>
<td>${l[6]}</td>
</tr>`;
});
document.getElementById("tabela").innerHTML=html;
});
</script>

</body>
</html>
