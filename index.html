<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitação de Diária</title>

<style>
body { font-family: Arial; background:#eef2f7; padding:20px;}
.card { background:white; padding:20px; margin:10px;}
input, textarea { width:100%; padding:10px; margin:5px;}
button { padding:15px; background:green; color:white; border:none;}
</style>
</head>

<body>

<h2>Solicitação de Diária</h2>

<form id="form">

<div class="card">
<input name="nome" placeholder="Nome" required>
<input name="cpf" placeholder="CPF" required>
<input name="secretaria" placeholder="Secretaria">
<input name="destino" placeholder="Destino">
</div>

<button type="submit">Enviar</button>

</form>

<script>
document.getElementById("form").addEventListener("submit", function(e){
  e.preventDefault();

  const dados = Object.fromEntries(new FormData(this));

  fetch("https://script.google.com/macros/s/AKfycbwVRTUjfHdFMoF3xF-52wsZGHNPfFI1nhGWafDo9J_iFVGSDz3McqZFVafjl1FRAol4Jw/exec", {
    method: "POST",
    mode: "no-cors",
    body: new URLSearchParams(dados)
  });

  alert("Enviado!");
  this.reset();
});
</script>

</body>
</html>
